
<div id="wac-ranking" style="width:276px;max-width:100%;padding:15px;background:transparent;border:1px solid #ffffff33;border-radius:15px;color:white;font-family:Arial,sans-serif;box-sizing:border-box">
  <h3 style="text-align:center;margin:0;font-size:20px">Top 3 Podium</h3>
  <hr style="border:0;height:1px;background:linear-gradient(to right,transparent,#36a0eb,transparent);margin:15px 0">
  <div id="wac-podium" style="display:flex;align-items:flex-end;gap:4px;text-align:center"></div>
  <h3 style="text-align:center;font-size:20px;margin:20px 0 12px">Rankings</h3>
  <hr style="border:0;height:1px;background:linear-gradient(to right,transparent,#36a0eb,transparent)">
  <div id="wac-list" style="max-height:145px;overflow:auto"></div>
  <a href="https://www.chess.com/club/leaderboard/we-are-the-champions-7" target="_blank" style="display:block;text-align:center;text-decoration:none;background:linear-gradient(#81b64c,#5d9948);color:white;font-weight:bold;padding:12px;border-radius:6px;margin-top:12px">Full list</a>
  <div id="wac-status" style="font-size:10px;color:#9bb8db;margin-top:8px;text-align:center">Loading rankings...</div>
</div>

<script>
(async function(){
  const DATA_URL = "https://wacwidget.github.io/Maches2/data.json";
  const podium = document.getElementById("wac-podium");
  const list = document.getElementById("wac-list");
  const status = document.getElementById("wac-status");

  function playerCard(p, rank) {
    const box = document.createElement("div");
    box.style.cssText = "flex:1;min-width:0;padding:8px 2px;border:1px solid #ffffff25;border-radius:10px;background:#13244799";

    const medal = document.createElement("div");
    medal.textContent = rank === 1 ? "👑" : rank;
    medal.style.cssText = "font-size:20px;font-weight:bold;color:" + (rank===1?"#ffb84d":rank===2?"#c0c0c0":"#cd7f32");

    const a = document.createElement("a");
    a.href = "https://www.chess.com/member/" + encodeURIComponent(p.username);
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = p.username;
    a.style.cssText = "display:block;color:white;font-size:10px;font-weight:bold;text-decoration:none;overflow-wrap:anywhere;margin-top:5px";

    const pts = document.createElement("div");
    pts.textContent = p.points + " Pts";
    pts.style.cssText = "font-size:10px;color:#ffca71;font-weight:bold;margin-top:5px";

    box.append(medal,a,pts);
    return box;
  }

  async function update(){
    try {
      const response = await fetch(DATA_URL + "?t=" + Date.now(), {cache:"no-store"});
      if (!response.ok) throw new Error("Data unavailable");
      const data = await response.json();
      const players = data.players.sort((a,b)=>b.points-a.points);

      podium.replaceChildren();
      [players[1],players[0],players[2]].forEach((p,i)=>{
        if(p) podium.append(playerCard(p,[2,1,3][i]));
      });

      list.replaceChildren();
      players.slice(3).forEach((p,i)=>{
        const a = document.createElement("a");
        a.href = "https://www.chess.com/member/" + encodeURIComponent(p.username);
        a.target = "_blank";
        a.rel = "noopener";
        a.style.cssText = "display:flex;justify-content:space-between;gap:5px;padding:6px;background:#ffffff0a;border-radius:5px;margin:4px 0;color:#4dc3ea;text-decoration:none;font-size:11px;font-weight:bold";
        const name = document.createElement("span");
        name.textContent = "#" + (i+4) + " " + p.username;
        const points = document.createElement("span");
        points.textContent = p.points + " Pts";
        points.style.color = "white";
        a.append(name,points);
        list.append(a);
      });

      status.textContent = "Updated: " + new Date().toLocaleTimeString();
    } catch(e) {
      status.textContent = "Rankings data unavailable.";
    }
  }

  update();
  setInterval(update, 60000);
})();
</script>
