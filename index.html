
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAC Podium</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:4px;background:transparent;color:#fff;font-family:Arial,sans-serif}
.panel{width:100%;padding:15px;margin-bottom:10px;background:linear-gradient(135deg,#0a0f2ccc,#0d1b4bcc,#1a2f6fcc);border:1px solid #ffffff33;border-radius:15px;transition:.3s}
.panel:hover{border-color:#ddb04099;box-shadow:0 0 10px #ddb04055}
h2{font-size:20px;text-align:center;margin:0}
hr{border:0;height:1px;background:linear-gradient(to right,transparent,#36a0eb,transparent);margin:15px 0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:4px;text-align:center}
.player{flex:1;min-width:0;padding:9px 3px;background:#ffffff08;border:1px solid #ffffff25;border-radius:12px;overflow-wrap:anywhere}
.player.first{padding:12px 3px;transform:translateY(-4px);background:#ffb84d12;border-color:#ffb84d55}
.medal{width:32px;height:32px;margin:0 auto 5px;border:2px solid #c0c0c0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#c0c0c0;background:#18243a}
.first .medal{width:40px;height:40px;border-color:#ffb84d;color:#ffb84d;font-size:18px;box-shadow:0 0 12px #ffb84d66}
.third .medal{border-color:#cd7f32;color:#cd7f32}
.name{display:block;color:#fff;text-decoration:none;font-size:11px;font-weight:bold;line-height:1.4}
.first .name{font-size:12px}
.points{font-size:10px;font-weight:bold;color:#ffb84d;margin-top:4px}
.rankrow{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:7px 8px;margin:4px 0;background:#ffffff09;border-radius:6px;font-size:11px}
.rankrow a{color:#4dc3ea;text-decoration:none;font-weight:bold;overflow-wrap:anywhere}
.ranknum{color:#a0a9bc;font-size:10px;white-space:nowrap}
.rankpoints{font-size:10px;white-space:nowrap}
#ranking-list{max-height:160px;overflow-y:auto}
.full{display:block;margin-top:12px;padding:11px;text-align:center;background:linear-gradient(#81b64c,#5d9948);border-radius:6px;color:white;text-decoration:none;font-weight:bold;font-size:15px}
.full:hover{filter:brightness(1.1)}
.status{text-align:center;color:#9bb8db;font-size:10px;margin-top:8px}
</style>
</head>
<body>
<section class="panel">
  <h2>Top 3 Podium</h2>
  <hr>
  <div class="podium" id="podium"></div>
</section>

<section class="panel">
  <h2>Rankings</h2>
  <hr>
  <div id="ranking-list"></div>
  <a class="full" href="https://www.chess.com/club/leaderboard/we-are-the-champions-7" target="_blank" rel="noopener">Full list</a>
  <div class="status" id="status">Rankings loaded</div>
</section>

<script>
const players = [
  {username:"chicklick",points:45.5},
  {username:"Taltal1357",points:38.5},
  {username:"artemas",points:24},
  {username:"alexandrkalistratov",points:23},
  {username:"Cloverseot",points:22},
  {username:"DursunSaliev",points:22},
  {username:"Sadashivaram",points:16},
  {username:"Goran-Iliana16",points:16},
  {username:"CristianoRonaldo1807",points:15},
  {username:"imsilsa",points:14}
];

const podium = document.getElementById("podium");
const list = document.getElementById("ranking-list");

function profile(username){
  return "https://www.chess.com/member/" + encodeURIComponent(username);
}

function makePlayer(p,rank){
  const card=document.createElement("div");
  card.className="player"+(rank===1?" first":rank===3?" third":"");

  if(rank===1){
    const crown=document.createElement("div");
    crown.textContent="👑";
    crown.style.fontSize="13px";
    card.appendChild(crown);
  }

  const medal=document.createElement("div");
  medal.className="medal";
  medal.textContent=rank;
  card.appendChild(medal);

  const a=document.createElement("a");
  a.className="name";
  a.href=profile(p.username);
  a.target="_blank";
  a.rel="noopener";
  a.textContent=p.username;
  card.appendChild(a);

  const points=document.createElement("div");
  points.className="points";
  points.textContent=p.points+" Pts";
  card.appendChild(points);
  return card;
}

function render(){
  const sorted=[...players].sort((a,b)=>b.points-a.points);
  podium.replaceChildren();
  list.replaceChildren();

  // Display 2nd, 1st, 3rd in podium order.
  [sorted[1],sorted[0],sorted[2]].forEach((p,i)=>{
    if(p) podium.appendChild(makePlayer(p,[2,1,3][i]));
  });

  sorted.slice(3).forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="rankrow";

    const left=document.createElement("span");
    left.className="ranknum";
    left.append("#"+(i+4)+" ");

    const a=document.createElement("a");
    a.href=profile(p.username);
    a.target="_blank";
    a.rel="noopener";
    a.textContent=p.username;
    left.appendChild(a);

    const pts=document.createElement("span");
    pts.className="rankpoints";
    pts.textContent=p.points+" Pts";

    row.append(left,pts);
    list.appendChild(row);
  });

  document.getElementById("status").textContent=
    "Showing "+sorted.length+" players";
}
render();
</script>
</body>
</html>
